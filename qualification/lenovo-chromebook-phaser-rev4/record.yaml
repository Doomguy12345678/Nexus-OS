notes: >-
  Draft inventory populated from user-reported inxi, free, lsblk, and os-release
  output. Storage entries have been mapped from the pasted table; the loop0
  line was partially garbled and should be checked against raw output. Exact
  Lenovo retail model, firmware, wireless hardware, and test evidence are not
  yet known. USB boot is user-reported; UEFI boot was confirmed by the presence
  of /sys/firmware/efi. The root mount was reported as overlay/overlay,
  consistent with a live session but not identifying the backing device.
  Wi-Fi connectivity and speaker playback were user-confirmed working in the
  live session; see evidence/live-session-smoke.md. Memory values are a point-in-time
  snapshot. This record is not a
  hardware qualification or Nexus-OS support claim. The current system is LMDE
  and is not the proposed Fedora Atomic KDE baseline.